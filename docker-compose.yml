services:
  # Postgres with pgvector: incidents and their embeddings live in one database.
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The same image the Dockerfile builds for deployment, so local and deployed
  # runs share one dependency set and one embedding model.
  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@db:5432/sentinel
      SENTINEL_ADMIN_KEY: ${SENTINEL_ADMIN_KEY:-local-dev-only}
      LLM_API_KEY: ${LLM_API_KEY:-}
      PORT: "8000"
    # Application code only, so the baked-in model and virtualenv stay in place.
    volumes:
      - ./backend/app:/app/app:ro
    command: ["sh", "-c", "exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir app"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pg_data:
