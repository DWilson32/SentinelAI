name: Sync real crisis feeds

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render feed ingestion
        env:
          SENTINEL_ADMIN_KEY: ${{ secrets.SENTINEL_ADMIN_KEY }}
        run: |
          if [ -z "$SENTINEL_ADMIN_KEY" ]; then
            echo "SENTINEL_ADMIN_KEY repository secret is not set." >&2
            exit 1
          fi
          curl --fail --show-error --silent \
            --request POST \
            --header "X-API-Key: $SENTINEL_ADMIN_KEY" \
            https://sentinel-ai-api.onrender.com/api/incidents/ingest/real

      # Investigating what the sync turned up and delivering alerts is a separate
      # call, so storing reports does not wait on model calls or someone else's
      # endpoint. It works from derived state, so a missed run costs nothing: the
      # next one picks up whatever is still outstanding.
      - name: Investigate and alert on what it found
        env:
          SENTINEL_ADMIN_KEY: ${{ secrets.SENTINEL_ADMIN_KEY }}
        run: |
          curl --fail --show-error --silent \
            --request POST \
            --header "X-API-Key: $SENTINEL_ADMIN_KEY" \
            https://sentinel-ai-api.onrender.com/api/monitor/follow-up
