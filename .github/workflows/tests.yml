name: Tests

# On every push and pull request: the backend suite on the Python that Render
# runs, and the frontend type check and build as Vercel runs them.
on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # As on Render (render.yaml).
          python-version: "3.12.8"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # As Vercel installs (vercel.json): npm, from the exact versions in package.json.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
